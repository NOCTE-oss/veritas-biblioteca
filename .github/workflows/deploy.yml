name: Deploy Vue app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vue-projeto/package-lock.json
      - name: Install root dependencies (Tailwind CSS)
        run: npm ci --include=optional
      - name: Install Vue app dependencies
        run: npm ci --include=optional
        working-directory: vue-projeto
      - name: Verify Lightning CSS native binary
        run: node -e "require('lightningcss'); console.log('Lightning CSS loaded successfully')"
        working-directory: .
      - name: Build Vue app
        run: npm run build
        working-directory: vue-projeto
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vue-projeto/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
